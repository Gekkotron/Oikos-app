name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.group.name }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: core
            # KMP (oikos.kmp.jvm.library) modules use :jvmTest; Android library modules use :test.
            # Per-module koverXmlReport (not the root one) keeps the job scoped to :core:*;
            # the root koverXmlReport aggregates ALL subprojects and dragged :app and :feature:*
            # test tasks into this job, causing cross-module flakes.
            tasks: >-
              :core:model:jvmTest
              :core:crypto:test
              :core:transport:test
              :core:state:jvmTest
              :core:source:jvmTest
              :core:voice:jvmTest
              :core:data:test
              :core:alerts:test
              :core:history:jvmTest
              :core:flows:jvmTest
              :core:push:test
              :core:demo:test
              :core:designsystem:test
              :core:model:koverXmlReport
              :core:crypto:koverXmlReport
              :core:transport:koverXmlReport
              :core:state:koverXmlReport
              :core:source:koverXmlReport
              :core:voice:koverXmlReport
              :core:data:koverXmlReport
              :core:alerts:koverXmlReport
              :core:history:koverXmlReport
              :core:flows:koverXmlReport
              :core:push:koverXmlReport
              :core:demo:koverXmlReport
              :core:designsystem:koverXmlReport
          - name: feature
            tasks: >-
              :feature:home:test
              :feature:onboarding:test
              :feature:energy:test
              :feature:history:test
              :feature:security:test
              :feature:automations:test
              :feature:settings:test
              :feature:alerts:test
              :feature:widget:test
              :feature:voice:test
              koverXmlReport
              -x :app:koverXmlReport
          - name: app
            tasks: >-
              :app:test
              :app:assembleDebug
              koverXmlReport
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: ${{ matrix.group.name }} tests
        # Configuration cache is enabled in gradle.properties for local dev speed, but we
        # disable it on CI with -Dorg.gradle.configuration-cache=false: the :app job's
        # Hilt KSP + Compose UI + Robolectric combo hangs the invocation under CC in CI
        # even though it stores a cache entry cleanly on a dev machine. Revisit when AGP /
        # Hilt / KSP CC compatibility improves.
        # :core and :feature jobs pass -x :app:koverXmlReport so Gradle doesn't drag
        # :app:testDebugUnitTest in through koverXmlReport's cross-module aggregation —
        # that task deadlocks when co-scheduled with the parallel :feature:*:test tasks.
        # :app coverage is uploaded by the dedicated :app matrix job.
        run: ./gradlew ${{ matrix.group.tasks }} -Dorg.gradle.configuration-cache=false --stacktrace --continue
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # core job writes per-module XMLs under core/*/build/reports/kover/report.xml;
          # feature + app jobs still produce the root-aggregated report.
          files: ${{ matrix.group.name == 'core' && 'core/model/build/reports/kover/report.xml,core/crypto/build/reports/kover/report.xml,core/transport/build/reports/kover/report.xml,core/state/build/reports/kover/report.xml,core/source/build/reports/kover/report.xml,core/voice/build/reports/kover/report.xml,core/data/build/reports/kover/report.xml,core/alerts/build/reports/kover/report.xml,core/history/build/reports/kover/report.xml,core/flows/build/reports/kover/report.xml,core/push/build/reports/kover/report.xml,core/demo/build/reports/kover/report.xml,core/designsystem/build/reports/kover/report.xml' || 'build/reports/kover/report.xml' }}
          flags: ${{ matrix.group.name }}
          fail_ci_if_error: false
      - name: Upload debug APK
        if: matrix.group.name == 'app' && success()
        uses: actions/upload-artifact@v4
        with:
          name: oikos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
